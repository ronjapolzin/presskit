<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kiss the Moon Release Tour – Practice</title>
<style>
  /* background image: bg.webp next to this page, fixed while the songs scroll */
  :root {
    --bg-image: url("bg.webp");
    --veil: rgba(20, 10, 32, 0.45);
    --card: rgba(22, 14, 34, 0.62);
    --ink: #fff;
    --muted: rgba(255, 255, 255, 0.72);
    --rule: rgba(255, 255, 255, 0.16);
    --accent: #ffb8ec;
    --accent-soft: rgba(255, 120, 220, 0.18);
    --btn-ink: #2a1236;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #1a0f24; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #1a0f24;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    isolation: isolate;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(var(--veil), var(--veil)), var(--bg-image) center / cover no-repeat, #1a0f24;
  }
  header { text-shadow: 0 2px 18px rgba(20, 8, 30, 0.55); }
  header p { color: rgba(255, 255, 255, 0.85) !important; }
  h4.group, .tools { text-shadow: 0 1px 10px rgba(20, 8, 30, 0.7); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 72px 24px 120px; }

  header { margin-bottom: 48px; }
  h1 {
    font-size: clamp(36px, 7vw, 64px);
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  header p { margin-top: 16px; color: var(--muted); font-size: 15px; max-width: 52ch; }

  /* one collapsible card per song */
  details.song {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    -webkit-backdrop-filter: blur(18px) saturate(1.2);
    backdrop-filter: blur(18px) saturate(1.2);
  }
  details.song > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 22px;
    user-select: none;
  }
  details.song > summary::-webkit-details-marker { display: none; }
  summary .n { color: var(--muted); font-variant-numeric: tabular-nums; width: 1.6em; }
  summary h2 {
    flex: 1;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  summary .tags { display: flex; gap: 6px; }
  summary .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }
  summary .chev {
    width: 10px; height: 10px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg) translateY(-3px);
    transition: transform .2s;
    flex: none;
  }
  details[open] > summary .chev { transform: rotate(-135deg) translateY(-3px); }

  .body { padding: 0 22px 26px 22px; border-top: 1px solid var(--rule); }
  .body h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 24px 0 10px;
  }
  .note { color: var(--muted); font-size: 14px; font-style: italic; margin-top: 18px; }

  /* recordings */
  .rec { margin-bottom: 14px; }
  .rec-label { font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 12px; }
  .rec audio { width: 100%; display: block; }
  .speed { display: flex; gap: 4px; }
  .speed button {
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 1px 7px;
    cursor: pointer;
  }
  .speed button.on { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); }
  .missing { font-size: 14px; color: var(--muted); }

  /* lyrics */
  .lyrics { font-size: 17px; line-height: 1.6; }
  .lyrics p + p { margin-top: 1.1em; }
  .lyrics .line { display: block; }
  .lyrics .two {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    margin: 0 -6px;
    padding: 0 6px;
    border-radius: 4px;
  }
  .lyrics .line .two { margin: 0; padding: 0 4px; font-style: italic; }
  .lyrics .line strong.two { font-style: normal; font-weight: 700; padding: 0 3px; }
  .lyrics .line em strong.two { font-style: italic; }
  .legend { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .legend span { background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 0 5px; border-radius: 3px; }

  /* sheet music */
  .sheet img { width: 100%; border-radius: 8px; border: 1px solid var(--rule); background: #fff; display: block; }
  .sheet img + img { margin-top: 10px; }
  .sheet a { color: var(--accent); }

  h4.group {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.85);
    margin: 36px 0 12px 4px;
  }
  h4.group:first-child { margin-top: 0; }
  .tools { display: flex; gap: 16px; margin-bottom: 20px; font-size: 14px; }
  .tools button { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }

  @media (max-width: 560px) {
    .wrap { padding: 48px 16px 96px; }
    details.song > summary { padding: 16px; gap: 12px; }
    summary .tags { display: none; }
    .body { padding: 0 16px 22px; }
    .lyrics { font-size: 16px; }
  }
</style>

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function lyricsHTML(text) {
  return text.trim().split(/\n\s*\n/).map((stanza) =>
    "<p>" + stanza.split("\n").map((raw) => {
      const l = raw.trim();
      const two = l.startsWith("+ ");
      const html = esc(two ? l.slice(2) : l)
        .replace(/\{([^}]*)\}/g, '<span class="two">$1</span>')
        .replace(/\*([^*]+)\*/g, '<strong class="two">$1</strong>')
        .replace(/(^|[\s(>])_([^_]+)_(?=$|[\s).,!?<])/g, '$1<em>$2</em>');
      return `<span class="line${two ? " two" : ""}">${html || "&nbsp;"}</span>`;
    }).join("") + "</p>"
  ).join("");
}

function recordingsHTML(recs = []) {
  if (!recs.length) return `<p class="missing">No recording yet.</p>`;
  return recs.map((r) => `
    <div class="rec">
      <div class="rec-label">
        <span>${esc(r.label)}</span>
        <span class="speed">
          ${[0.75, 0.9, 1].map((s) => `<button type="button" data-speed="${s}" class="${s === 1 ? "on" : ""}">${s}×</button>`).join("")}
        </span>
      </div>
      <audio controls preload="none" src="${esc(r.src)}"></audio>
    </div>`).join("");
}

function sheetHTML(sheet) {
  if (!sheet) return "";
  const files = Array.isArray(sheet) ? sheet : [sheet];
  const inner = files.map((f) => /\.pdf$/i.test(f)
    ? `<p><a href="${esc(f)}" target="_blank" rel="noopener">Open sheet music as PDF ↗</a></p>`
    : `<a href="${esc(f)}" target="_blank" rel="noopener"><img src="${esc(f)}" alt="Sheet music" loading="lazy"></a>`
  ).join("");
  return `<h3>Sheet music</h3><div class="sheet">${inner}</div>`;
}

const root = document.getElementById("songs");
root.innerHTML = SONGS.map((s, i) => {
  const hasTwo = /^\s*\+ |[{*]/m.test(s.lyrics || "");
  const tags = [
    s.recordings?.length ? "Audio" : "",
    s.sheet ? "Sheet music" : "",
  ].filter(Boolean).map((t) => `<span class="tag">${t}</span>`).join("");
  const groupHead = s.group && s.group !== SONGS[i - 1]?.group
    ? `<h4 class="group">${esc(s.group)}</h4>` : "";
  return `${groupHead}
  <details class="song" id="song-${i + 1}">
    <summary>
      <span class="n">${String(i + 1).padStart(2, "0")}</span>
      <h2>${esc(s.title)}</h2>
      <span class="tags">${tags}</span>
      <span class="chev" aria-hidden="true"></span>
    </summary>
    <div class="body">
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      <h3>Recordings</h3>
      ${recordingsHTML(s.recordings)}
      ${sheetHTML(s.sheet)}
      <h3>Lyrics</h3>
      ${hasTwo ? `<p class="legend"><span>highlighted</span> = second voice</p>` : ""}
      ${s.lyrics?.trim() ? `<div class="lyrics">${lyricsHTML(s.lyrics)}</div>` : `<p class="missing">Lyrics coming soon.</p>`}
    </div>
  </details>`;
}).join("");

// only one recording plays at a time; pause everything in a song when it is closed
document.addEventListener("play", (e) => {

}, true);
root.querySelectorAll("details.song").forEach((d) => d.addEventListener("toggle", () => {
  if (!d.open) d.querySelectorAll("audio").forEach((a) => a.pause());
}));

// speed buttons
root.addEventListener("click", (e) => {

  const rec = b.closest(".rec");
  const audio = rec.querySelector("audio");
  audio.playbackRate = Number(b.dataset.speed);
  audio.preservesPitch = true;
  rec.querySelectorAll("[data-speed]").forEach((x) => x.classList.toggle("on", x === b));
});

// a missing audio file shows a hint instead of a broken player
root.querySelectorAll("audio").forEach((a) => a.addEventListener("error", () => {
  a.closest(".rec").innerHTML = `<p class="missing">Recording “${esc(a.closest(".rec").querySelector(".rec-label span").textContent)}” is missing (${esc(a.getAttribute("src"))}).</p>`;
}));

document.getElementById("openAll").onclick = () => root.querySelectorAll("details").forEach((d) => (d.open = true));
document.getElementById("closeAll").onclick = () => root.querySelectorAll("details").forEach((d) => (d.open = false));

// open a song directly via #song-2
if (location.hash) document.querySelector(location.hash)?.setAttribute("open", "");
</script>
</body>
</html>
